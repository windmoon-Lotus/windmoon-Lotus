<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>贡献人目录｜百家职业信息共享大全</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#0b0f14;color:rgba(255,255,255,.92)}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:980px;margin:0 auto;padding:28px 16px}
    .card{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;background:rgba(255,255,255,.06)}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    @media (max-width:900px){.grid{grid-template-columns:1fr}}
    input{width:100%;max-width:520px;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:inherit;outline:none}
    .item{display:flex;gap:12px;align-items:flex-start}
    .av{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.08);flex:0 0 auto}
    .muted{color:rgba(255,255,255,.7);font-size:13px;line-height:1.55}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .btn{padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);display:inline-flex}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h2 style="margin:0 0 6px">贡献人目录</h2>
        <div class="muted">等权展示，支持贡献人自述信息与外部链接。</div>
      </div>
      <a class="btn" href="../index.html">返回首页</a>
    </div>

    <div class="card" style="margin-bottom:12px">
      <input id="q" placeholder="搜索：昵称 / @handle / id" />
    </div>

    <div id="list" class="grid"></div>
  </div>

<script>
  const $ = (id)=>document.getElementById(id);
  const escapeHtml = (s)=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

  let data = [];
  async function load(){
    const res = await fetch("../data/contributors.json",{cache:"no-store"});
    const json = await res.json();
    data = (json.contributors||[]);
    render();
  }

  function render(){
    const q = ($("q").value||"").trim().toLowerCase();
    const list = data.filter(c=>{
      if(!q) return true;
      return (c.id||"").toLowerCase().includes(q)
        || (c.displayName||"").toLowerCase().includes(q)
        || (c.handle||"").toLowerCase().includes(q);
    }).sort((a,b)=>(a.id||"").localeCompare(b.id||""));

    $("list").innerHTML = list.map(c=>{
      const url = `profile.html?id=${encodeURIComponent(c.id)}`;
      return `
        <a class="card" href="${url}">
          <div class="item">
            <img class="av" src="${escapeHtml(c.avatar||"")}" alt="" onerror="this.style.display='none'"/>
            <div>
              <div style="font-weight:600">${escapeHtml(c.displayName||c.id)}</div>
              <div class="muted">${escapeHtml(c.handle||"")}</div>
              <div class="muted" style="margin-top:6px">${escapeHtml(c.bio||"")}</div>
            </div>
          </div>
        </a>
      `;
    }).join("") || `<div class="card">未找到匹配项。</div>`;
  }

  $("q").addEventListener("input", render);
  load();
</script>
</body>
</html>
