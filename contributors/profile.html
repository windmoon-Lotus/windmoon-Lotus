<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>贡献人详情｜百家职业信息共享大全</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;margin:0;background:#0b0f14;color:rgba(255,255,255,.92)}
    a{color:inherit;text-decoration:none}
    .wrap{max-width:980px;margin:0 auto;padding:28px 16px}
    .card{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;background:rgba(255,255,255,.06)}
    .muted{color:rgba(255,255,255,.7);font-size:13px;line-height:1.55}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    .btn{padding:8px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);display:inline-flex}
    .head{display:flex;gap:12px;align-items:flex-start}
    .av{width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.08);flex:0 0 auto}
    .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .chip{font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(255,255,255,.7)}
    .list{display:grid;gap:10px;margin-top:10px}
    .item{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
    .right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    details summary{cursor:pointer;user-select:none}
    .k{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;color:rgba(255,255,255,.7)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h2 id="title" style="margin:0 0 6px">贡献人详情</h2>
        <div class="muted">个人信息与外链由贡献人提供；贡献明细来自时间线事件。</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <a class="btn" href="index.html">贡献人目录</a>
        <a class="btn" href="../index.html">返回首页</a>
      </div>
    </div>

    <div id="profile" class="card"></div>

    <div style="height:12px"></div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
        <div>
          <div style="font-weight:600">贡献明细（时间线）</div>
          <div class="muted">仅按时间展示，不做排行与对比。</div>
        </div>
        <div class="k">数据来源：/data/events.json</div>
      </div>
      <div id="events" class="list"></div>
    </div>
  </div>

<script>
  const TAGS = {
    industry: "行业洞察",
    career: "职业词条",
    fieldwork: "访谈/一手报告",
    review: "校对/审核",
    tooling: "工具/模板",
    resource: "资源整理"
  };

  const $ = (id)=>document.getElementById(id);
  const escapeHtml = (s)=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");

  function getId(){
    const u = new URL(location.href);
    return u.searchParams.get("id") || "";
  }

  function fmt(t){
    const d = new Date(t);
    if(isNaN(d.getTime())) return escapeHtml(t);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const dd = String(d.getDate()).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    return `${yyyy}-${mm}-${dd} ${hh}:${mi}`;
  }

  async function load(){
    const id = getId();
    if(!id){
      $("profile").innerHTML = `<div class="muted">缺少 id 参数。请从“贡献人目录”进入。</div>`;
      return;
    }

    const [cRes, eRes] = await Promise.all([
      fetch("../data/contributors.json",{cache:"no-store"}),
      fetch("../data/events.json",{cache:"no-store"})
    ]);

    const contributors = (await cRes.json()).contributors || [];
    const events = (await eRes.json()).events || [];

    const c = contributors.find(x=>x.id===id);
    if(!c){
      $("profile").innerHTML = `<div class="muted">未找到该贡献人：${escapeHtml(id)}</div>`;
      return;
    }

    document.title = `贡献人｜${c.displayName||c.id}`;
    $("title").textContent = `贡献人详情：${c.displayName||c.id}`;

    const links = (c.links||[]).map(l=>`<a class="chip" href="${escapeHtml(l.url)}" target="_blank" rel="noreferrer">${escapeHtml(l.label)}</a>`).join("");
    $("profile").innerHTML = `
      <div class="head">
        <img class="av" src="${escapeHtml(c.avatar||"")}" alt="" onerror="this.style.display='none'"/>
        <div style="flex:1">
          <div style="font-weight:700;font-size:16px">${escapeHtml(c.displayName||c.id)}</div>
          <div class="muted">${escapeHtml(c.handle||"")}</div>
          <div class="muted" style="margin-top:8px">${escapeHtml(c.bio||"")}</div>
          <div class="chips">${links || `<span class="muted">未提供外链。</span>`}</div>
        </div>
      </div>
      <div class="k" style="margin-top:10px">id: ${escapeHtml(c.id)}</div>
    `;

    const my = events
      .filter(e=>e.personId===id)
      .slice()
      .sort((a,b)=>new Date(b.time).getTime()-new Date(a.time).getTime());

    $("events").innerHTML = my.map(e=>{
      const scope = `${escapeHtml(e.scope?.industry||"未分类")} · ${escapeHtml(e.scope?.career||"未指定职业")}`;
      const tags = (e.tags||[]).map(t=>`<span class="chip">${escapeHtml(TAGS[t]||t)}</span>`).join("");
      const evidence = (e.evidence||[]).map(x=>`<a class="chip" href="${escapeHtml(x.url)}" target="_blank" rel="noreferrer">${escapeHtml(x.label)}</a>`).join("");
      return `
        <div class="card">
          <div class="item">
            <div style="flex:1">
              <div style="font-weight:600">${escapeHtml(e.summary||"")}</div>
              <div class="muted" style="margin-top:6px">${scope}</div>
              <div class="k" style="margin-top:6px">时间：${escapeHtml(fmt(e.time))}</div>
              ${e.details ? `
                <details style="margin-top:8px">
                  <summary class="chip">展开详细说明</summary>
                  <div class="muted" style="margin-top:8px">${escapeHtml(e.details)}</div>
                </details>` : ""
              }
              ${evidence ? `<div class="chips" style="margin-top:10px">${evidence}</div>` : ""}
            </div>
            <div class="right">${tags}</div>
          </div>
        </div>
      `;
    }).join("") || `<div class="muted" style="margin-top:10px">暂无该贡献人的事件记录。</div>`;
  }

  load();
</script>
</body>
</html>
